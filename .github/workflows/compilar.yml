name: Compilar Kinova Cortes
# O código do programa fica no repositório PRIVADO wadysonluiz/kinova-cortes.
# Este repositório é público só para usar os minutos grátis de compilação: o código é lido
# com a chave de leitura guardada no segredo KC_LEITURA e não fica salvo aqui.
# Para compilar: mude o número em compilar.txt (ou rode à mão em Actions).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["compilar.txt"]

permissions:
  contents: read

jobs:
  mac:
    if: github.repository_owner == 'wadysonluiz'
    runs-on: macos-latest   # Apple Silicon
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wadysonluiz/kinova-cortes
          ref: main
          ssh-key: ${{ secrets.KC_LEITURA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependências
        run: pip install -r requirements.txt pyinstaller
      - name: ffmpeg (com libass) e deno
        run: |
          mkdir -p build/bin && cd build/bin
          curl -fsSL -o ffmpeg.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          curl -fsSL -o ffprobe.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip"
          curl -fsSL -o deno.zip "https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip"
          unzip -o ffmpeg.zip && unzip -o ffprobe.zip && unzip -o deno.zip && rm -f *.zip
          chmod +x ffmpeg ffprobe deno
          xattr -cr . || true
          ./ffmpeg -hide_banner -version | head -1
          ./ffmpeg -hide_banner -filters | grep -E " ass "
          ./ffmpeg -hide_banner -encoders | grep -E "h264_videotoolbox|libx264"
          ./deno --version
      - name: Ícone
        run: |
          mkdir -p build/mac/KinovaCortes.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s build/mac/icone_1024.png --out build/mac/KinovaCortes.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d build/mac/icone_1024.png --out build/mac/KinovaCortes.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns build/mac/KinovaCortes.iconset -o build/mac/KinovaCortes.icns
      - name: Compilar app
        run: python build/build_app.py
      - name: Teste do HTTPS do ffmpeg embutido (sem certificados do sistema)
        run: |
          SSL_CERT_DIR=/nada "dist/Kinova Cortes.app/Contents/MacOS/Kinova Cortes" --testar-https
      - name: Testes de unidade
        run: python tests/teste_unidades.py
      - name: Teste do app compilado
        run: python tests/smoke_app.py "dist/Kinova Cortes.app/Contents/MacOS/Kinova Cortes" "$PWD/build/bin/ffmpeg"
      - name: Teste do plano grátis (app compilado, licença de verdade)
        run: python tests/teste_licenca.py "dist/Kinova Cortes.app/Contents/MacOS/Kinova Cortes" "$PWD/build/bin/ffmpeg"
      - name: Teste completo (funções PRO, sincronia, live imitando o YouTube)
        run: PATH="$PWD/build/bin:$PATH" python tests/teste_completo.py dev "$PWD/build/bin/ffmpeg"
      - name: Teste do YouTube (informativo)
        continue-on-error: true
        run: |
          "dist/Kinova Cortes.app/Contents/MacOS/Kinova Cortes" --yt-dlp --js-runtimes "deno:$PWD/build/bin/deno" -F "https://www.youtube.com/watch?v=jNQXAC9IVRw" | tail -5
      - name: Instalador .dmg
        run: bash build/mac/make_dmg.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: KinovaCortes-mac-arm64
          path: dist/*.dmg
          retention-days: 7

  windows:
    if: github.repository_owner == 'wadysonluiz'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wadysonluiz/kinova-cortes
          ref: main
          ssh-key: ${{ secrets.KC_LEITURA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependências
        run: pip install -r requirements.txt pyinstaller
      - name: ffmpeg (com libass e x264) e deno
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\bin | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ffx
          $b = Get-ChildItem -Recurse ffx -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $b.FullName build\bin\ffmpeg.exe
          Copy-Item (Join-Path $b.DirectoryName "ffprobe.exe") build\bin\ffprobe.exe
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath build\bin -Force
          & build\bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          & build\bin\ffmpeg.exe -hide_banner -filters | Select-String " ass "
          & build\bin\ffmpeg.exe -hide_banner -encoders | Select-String "libx264"
          & build\bin\deno.exe --version
      - name: Compilar app
        run: python build/build_app.py
      - name: Teste do HTTPS do ffmpeg embutido
        shell: pwsh
        run: '& "dist\Kinova Cortes\kinova-cortes-cli.exe" --testar-https'
      - name: Testes de unidade
        run: python tests/teste_unidades.py
      - name: Teste do app compilado
        shell: pwsh
        run: python tests/smoke_app.py "dist\Kinova Cortes\kinova-cortes-cli.exe" "$PWD\build\bin\ffmpeg.exe"
      - name: Teste do plano grátis (app compilado, licença de verdade)
        shell: pwsh
        run: python tests/teste_licenca.py "dist\Kinova Cortes\kinova-cortes-cli.exe" "$PWD\build\bin\ffmpeg.exe"
      - name: Teste completo (funções PRO, sincronia, live imitando o YouTube)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\build\bin;" + $env:PATH
          python tests/teste_completo.py dev "$PWD\build\bin\ffmpeg.exe"
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $v = (python -c "import sys; sys.path.insert(0,'.'); from kinova_cortes import VERSAO; print(VERSAO)").Trim()
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" build\windows\kinova-cortes.iss
      - uses: actions/upload-artifact@v4
        with:
          name: KinovaCortes-windows-x64
          path: dist/*.exe
          retention-days: 7

